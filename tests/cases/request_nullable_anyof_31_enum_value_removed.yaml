# OpenAPI 3.0 -> 3.1 migration: `nullable: true` became `anyOf: [X, {type: "null"}]`.
# The null branch must be unwrapped so the enum inside X is still compared (found on OpenAI's spec).
version: "3.1.0"
old_paths:
  /runs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                effort: {type: string, enum: [low, medium, high], nullable: true}
      responses: {"200": {description: ok}}
new_paths:
  /runs:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                effort:
                  anyOf:
                    - {type: string, enum: [low, medium]}
                    - {type: "null"}
      responses: {"200": {description: ok}}
expected: [request-enum-value-removed]
