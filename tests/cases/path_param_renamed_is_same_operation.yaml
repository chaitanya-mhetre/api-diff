description: /users/{id} and /users/{userId} are the same route.
old_paths:
  /users/{id}:
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      get:
        responses:
          "200":
            content:
              application/json:
                schema: {type: object, required: [id, name], properties: {id: {type: integer}, name: {type: string}, nick: {type: string}}}

new_paths:
  /users/{userId}:
      parameters: [{name: userId, in: path, required: true, schema: {type: integer}}]
      get:
        responses:
          "200":
            content:
              application/json:
                schema: {type: object, required: [id, name], properties: {id: {type: integer}, name: {type: string}, nick: {type: string}}}

expected: []
