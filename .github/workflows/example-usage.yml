# How a consuming repository would use the action (kept here as documentation; it runs
# against this repo's example spec on pull requests).
name: api-compat
on: pull_request
jobs:
  api-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./        # in another repo: <owner>/api-diff@v0
        with:
          spec: examples/bookstore-v2.yaml
