[project]
name = "api-diff"
version = "0.1.0"
description = "Detect breaking changes between two OpenAPI 3.x specs (CLI, GitHub Action, pytest helper)"
readme = "README.md"
authors = [
    { name = "Chaitanya Mhetre", email = "mhetrechaitanya06@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["openapi", "api", "breaking-changes", "ci", "swagger", "compatibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
api-diff = "api_diff.cli:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
